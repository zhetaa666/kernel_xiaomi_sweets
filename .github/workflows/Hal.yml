name: Build VCam External HAL Magisk Module (With Binaries)

on:
  workflow_dispatch:

jobs:
  build-module:
    runs-on: ubuntu-latest
    steps:
      - name: Persiapan Lingkungan & Download Android SDK
        run: |
          sudo apt-get update && sudo apt-get install -y simg2img zip unzip
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "system-images;android-33;google_apis;arm64-v8a"
          
      - name: Ekstrak File Binary dari Vendor Google Emulator
        run: |
          IMG_DIR="$ANDROID_HOME/system-images/android-33/google_apis/arm64-v8a"
          
          # Konversi dan Mount Image
          simg2img $IMG_DIR/vendor.img vendor.raw || cp $IMG_DIR/vendor.img vendor.raw
          sudo mkdir -p /mnt/vendor
          sudo mount -o loop,ro vendor.raw /mnt/vendor
          
          # Buat struktur folder Magisk
          mkdir -p VCam_External_HAL/META-INF/com/google/android
          mkdir -p VCam_External_HAL/system/vendor/bin/hw
          mkdir -p VCam_External_HAL/system/vendor/lib64/hw
          mkdir -p VCam_External_HAL/system/vendor/etc/init
          mkdir -p VCam_External_HAL/system/vendor/etc/vintf/manifest
          
          # Curi file-file binary inti
          cp /mnt/vendor/bin/hw/android.hardware.camera.provider@2.4-external-service VCam_External_HAL/system/vendor/bin/hw/
          cp /mnt/vendor/lib64/hw/camera.device@*external*.so VCam_External_HAL/system/vendor/lib64/hw/
          cp /mnt/vendor/etc/init/android.hardware.camera.provider@2.4-external-service.rc VCam_External_HAL/system/vendor/etc/init/
          
          sudo umount /mnt/vendor

      - name: Buat File Konfigurasi (module.prop)
        run: |
          cat << 'EOF' > VCam_External_HAL/module.prop
          id=vcam_external_hal_pro
          name=VCam External Camera Provider (Full Inject)
          version=v2.0
          versionCode=2
          author=Santuyajah212
          description=Modul injeksi external_camera HAL dan binary untuk dev/video3 di Redmi Note 10 Pro (A16)
          EOF

      - name: Buat Script Instalasi (updater-script & update-binary)
        run: |
          cat << 'EOF' > VCam_External_HAL/META-INF/com/google/android/updater-script
          #MAGISK
          EOF
          
          cat << 'EOF' > VCam_External_HAL/META-INF/com/google/android/update-binary
          #!/system/bin/sh
          OUTFD=$2
          ZIPFILE=$3
          ui_print() { echo -n -e "ui_print $1\n" > /proc/self/fd/$OUTFD; echo -n -e "ui_print\n" > /proc/self/fd/$OUTFD; }
          ui_print "- Menginstal VCam External HAL (Full Binary)..."
          unzip -o "$ZIPFILE" 'system/*' -d $MODPATH >&2
          
          ui_print "- Mengatur perizinan file sistem..."
          set_perm_recursive $MODPATH 0 0 0755 0644
          set_perm_recursive $MODPATH/system/vendor/bin 0 2000 0755 0755
          set_perm_recursive $MODPATH/system/vendor/etc/init 0 2000 0755 0644
          
          ui_print "- Selesai! Silakan Reboot."
          EOF
          chmod +x VCam_External_HAL/META-INF/com/google/android/update-binary

      - name: Buat Konfigurasi External Camera (XML)
        run: |
          cat << 'EOF' > VCam_External_HAL/system/vendor/etc/external_camera_config.xml
          <ExternalCamera>
              <Provider>
                  <ignore> </ignore>
              </Provider>
              <Device>
                  <MaxJpegBufferSize bytes="3145728"/>
                  <FpsConf>
                      <maxFps>30.0</maxFps>
                  </FpsConf>
                  <VideoSize>
                      <width>1280</width>
                      <height>720</height>
                  </VideoSize>
              </Device>
          </ExternalCamera>
          EOF

      - name: Buat VINTF Manifest (Bypass Anti-Hook)
        run: |
          cat << 'EOF' > VCam_External_HAL/system/vendor/etc/vintf/manifest/external_camera_manifest.xml
          <manifest version="1.0" type="device">
              <hal format="hidl">
                  <name>android.hardware.camera.provider</name>
                  <transport>hwbinder</transport>
                  <version>2.4</version>
                  <interface>
                      <name>ICameraProvider</name>
                      <instance>external/0</instance>
                  </interface>
              </hal>
          </manifest>
          EOF

      - name: Buat Script Auto-Bind device node (post-fs-data.sh)
        run: |
          cat << 'EOF' > VCam_External_HAL/post-fs-data.sh
          #!/system/bin/sh
          chmod 0666 /dev/video3
          chown system:camera /dev/video3
          EOF
          chmod +x VCam_External_HAL/post-fs-data.sh

      - name: Packing Modul Menjadi ZIP
        run: |
          cd VCam_External_HAL
          zip -r9 ../VCam_External_HAL_v2.zip *
          
      - name: Upload Modul ke GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VCam_External_HAL_v2
          path: VCam_External_HAL_v2.zip

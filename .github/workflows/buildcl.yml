name: "Build Kernel"

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: "Kernel Name"
        required: true
        type: string
        default: "FranxxCORE"
      codename:
        description: "Codename Build"
        required: true
        type: string
        default: "Rei-I"
      clang_url:
        description: "Direct URL Clang Toolchain (.tar.gz)"
        required: true
        type: string
        default: "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"

env:
  KERNEL_NAME: ${{ inputs.kernel_name }}
  DEVICE: "Sweet"
  CODENAME: ${{ inputs.codename }}
  DEFCONFIG: "sweet_defconfig"
  CLANG_URL: ${{ inputs.clang_url }}

  KBUILD_BUILD_USER: "RapliVX"
  KBUILD_BUILD_HOST: "NyarchLinux"
  TZ: "Asia/Jakarta"

jobs:
  setup_env:
    name: "PREPARE // ENVIRONMENT"
    runs-on: ubuntu-22.04
    outputs:
      clang_ver: ${{ steps.parse_clang.outputs.version }}
    steps:
      - name: "[PARSE] :: EXTRACT CLANG VERSION"
        id: parse_clang
        run: |
          URL="${{ env.CLANG_URL }}"
          FILENAME=$(basename "$URL")
          VERSION="${FILENAME%.tar.gz}"
          echo "Extracted Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: "[CACHE] :: CLANG_TOOLCHAIN"
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: aosp-clang
          key: ${{ runner.os }}-clang-${{ steps.parse_clang.outputs.version }}

      - name: "[DOWNLOAD] :: CLANG_TOOLCHAIN"
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          echo "Downloading Clang..."
          wget -q ${{ env.CLANG_URL }} -O aosp-clang.tar.gz
          mkdir -p aosp-clang
          tar -xf aosp-clang.tar.gz -C aosp-clang
          rm -f aosp-clang.tar.gz

  synchronization:
    name: "${{ matrix.unit }} // BUILD"
    needs: setup_env
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - unit: "UNIT-00 (AOSP-STD)"
            variant: "AOSP"
            ksu: false
            patch_miui: false
          - unit: "UNIT-01 (MIUI-STD)"
            variant: "MIUI"
            ksu: false
            patch_miui: true
          - unit: "UNIT-02 (AOSP-KSU)"
            variant: "AOSP-KSU"
            ksu: true
            patch_miui: false
          - unit: "UNIT-03 (MIUI-KSU)"
            variant: "MIUI-KSU"
            ksu: true
            patch_miui: true

    steps:
      - name: "[INIT] :: SOURCE_CHECKOUT"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "[RESTORE] :: CLANG_TOOLCHAIN"
        uses: actions/cache@v4
        with:
          path: aosp-clang
          key: ${{ runner.os }}-clang-${{ needs.setup_env.outputs.clang_ver }}
          fail-on-cache-miss: true

      - name: "[CACHE] :: CCACHE_ACCELERATION"
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.variant }}-
            ${{ runner.os }}-ccache-

      - name: "[SYSTEM] :: DEPENDENCIES"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
          bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
          git libncurses5-dev libssl-dev libxml2 libxml2-utils lzop make \
          python3 python3-pip unzip zip zlib1g-dev

      - name: "[CONFIG] :: CCACHE_SETUP"
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          ccache -M 2G
          ccache -o compression=true
          ccache -o compression_level=1
          ccache -z

      - name: "[MOD] :: KSU_INTEGRATION"
        if: matrix.ksu == true
        run: |
          echo "INITIATING MAMBOSU PROTOCOL ..."
          curl -LSs "https://raw.githubusercontent.com/RapliVx/KernelSU-Next/refs/heads/hookless/kernel/setup.sh" | bash -s hookless

      - name: "[MOD] :: V4L2LOOPBACK_INTEGRATION"
        run: |
          echo "INITIATING V4L2LOOPBACK v0.12.7 PROTOCOL (FIXED) ..."
          mkdir -p drivers/media/v4l2loopback
          curl -LSs "https://github.com/umlaeute/v4l2loopback/archive/refs/tags/v0.12.7.tar.gz" | tar -xz -C drivers/media/v4l2loopback --strip-components=1

          python3 << 'PYEOF'
          filepath = 'drivers/media/v4l2loopback/v4l2loopback.c'

          with open(filepath, 'r') as f:
              content = f.read()

          # ============================================================
          # PATCH 1: Total device = 1 (single virtual camera)
          # ============================================================
          content = content.replace(
              'static int devices = -1;',
              'static int devices = 1;'
          )

          # ============================================================
          # PATCH 2: exclusive_caps=1 — report sebagai CAPTURE-only
          #   PENTING agar Camera HAL / Android app tidak bingung
          #   karena default v4l2loopback report dual CAPTURE+OUTPUT
          # ============================================================
          content = content.replace(
              'static int exclusive_caps[MAX_DEVICES] = { [0 ... (MAX_DEVICES - 1)] = 0 };',
              'static int exclusive_caps[MAX_DEVICES] = { 1, [1 ... (MAX_DEVICES - 1)] = 0 };'
          )

          # ============================================================
          # PATCH 3: Card label disguise
          # ============================================================
          content = content.replace(
              'static char *card_label[MAX_DEVICES];',
              'static char *card_label[MAX_DEVICES] = { "Qualcomm Camera Subsystem", };'
          )

          # ============================================================
          # PATCH 4: max_buffers default 2 -> 8
          #   Camera HAL2/HAL3 minimal butuh 4-6 buffer untuk pipeline.
          # ============================================================
          content = content.replace(
              'static int max_buffers = 2;',
              'static int max_buffers = 8;'
          )

          # ============================================================
          # PATCH 5: max_openers default 10 -> 16
          #   Banyak app & cameraserver open device bersamaan.
          # ============================================================
          content = content.replace(
              'static int max_openers = 10;',
              'static int max_openers = 16;'
          )

          # ============================================================
          # PATCH 6: video_nr default -> 3
          #   Lock device ke /dev/video3 (sesuai setup user).
          #   Hilangkan ketergantungan ke parameter modul.
          # ============================================================
          content = content.replace(
              'static int video_nr[MAX_DEVICES] = { [0 ... (MAX_DEVICES - 1)] = -1 };',
              'static int video_nr[MAX_DEVICES] = { 3, [1 ... (MAX_DEVICES - 1)] = -1 };'
          )

          # ============================================================
          # CATATAN PENTING:
          #   Patch IOCTL hack lama TELAH DIHAPUS karena:
          #   - Return 0 untuk semua private ioctl bikin HAL kebingungan
          #   - Bisa trigger silent corruption di camera state machine
          #   - Tidak diperlukan untuk integrasi external_camera HAL
          # ============================================================

          with open(filepath, 'w') as f:
              f.write(content)
          print("V4L2LOOPBACK source patched successfully.")
          PYEOF

          # Setup in-tree Makefile
          echo 'obj-y += v4l2loopback.o' > drivers/media/v4l2loopback/Makefile
          echo 'obj-y += v4l2loopback/' >> drivers/media/Makefile
          echo "V4L2LOOPBACK INJECTED SUCCESSFULLY (CLEAN PATCH)."

      - name: "[MOD] :: KSU_PURGE"
        if: matrix.ksu == false
        run: |
          sed -i '/CONFIG_KSU/d' arch/arm64/configs/${{ env.DEFCONFIG }}

      - name: "[PATCH] :: MIUI_OPTIMIZATION"
        if: matrix.patch_miui == true
        run: |
          python3 -c "
          import os, re
          targets = ['dsi-panel-k6-38-0c-0a-fhd-dsc-video.dtsi', 'dsi-panel-k6-38-0e-0b-fhd-dsc-video.dtsi']
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if file in targets:
                      path = os.path.join(root, file)
                      with open(path, 'r') as f: content = f.read()
                      content = re.sub(r'qcom,mdss-pan-physical-width-dimension\s*=\s*<[0-9]+>;', 'qcom,mdss-pan-physical-width-dimension = <695>;', content)
                      content = re.sub(r'qcom,mdss-pan-physical-height-dimension\s*=\s*<[0-9]+>;', 'qcom,mdss-pan-physical-height-dimension = <1546>;', content)
                      with open(path, 'w') as f: f.write(content)
                      print(f'Patched dimensions for MIUI in {path}')
          "

      - name: "[COMPILE] :: KERNEL_BUILD"
        run: |
          export PATH="${{ github.workspace }}/aosp-clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          make O=out ${DEFCONFIG}

          make -j$(nproc --all) O=out \
            LLVM=1 LLVM_IAS=1 CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz dtbo.img dtb.img

      - name: "[STATS] :: CCACHE_REPORT"
        run: ccache -s

      - name: "[UPLOAD] :: ARTIFACTS"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-unit
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtb.img
            out/arch/arm64/boot/dtbo.img
          compression-level: 9

  human-instrumentality:
    name: "PROTOCOL: FINAL_DOGMA"
    runs-on: ubuntu-latest
    needs: [setup_env, synchronization]
    permissions:
      contents: write

    steps:
      - name: "[COLLECT] :: ARTIFACTS"
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: "[PACKAGE] :: ANYKERNEL3_ZIP"
        run: |
          mkdir -p release_zips
          git clone -q https://github.com/RapliVx/AnyKernel3.git -b sweet AnyKernel3

          cat > AnyKernel3/banner << 'EOF'
           FranxxCORE // MAMBOSU PROTOCOL
           BY RapliVX
          EOF

          for DIR in ./artifacts/*-unit; do
              VARIANT=$(basename "$DIR" -unit)
              echo "Packaging $VARIANT..."

              cp -f $DIR/Image.gz AnyKernel3/
              cp -f $DIR/dtb.img AnyKernel3/
              cp -f $DIR/dtbo.img AnyKernel3/

              cd AnyKernel3
              zip -r1 "../release_zips/${KERNEL_NAME}-${VARIANT}-${CODENAME}-$(date +'%Y%m%d').zip" * -x .git README.md
              cd ..
          done

      - name: "[RELEASE] :: GITHUB_RELEASE"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "EVA-${{ github.run_number }}"
          name: "ProjectEVA: MAMBOSU [Run ${{ github.run_number }}]"
          files: release_zips/*.zip
          body: |
            ### NERV SECURITY CLEARANCE REQUIRED
            **Mission:** Kernel Instrumentality (V4L2 Fixed)
            **Device:** Redmi Note 10 Pro (sweet)
            **Codename:** ${{ env.CODENAME }}
            **Compiler:** ${{ needs.setup_env.outputs.clang_ver }}

            #### DEPLOYED UNITS:
            | Variant | KSU | MIUI Patch |
            | :--- | :---: | :---: |
            | **AOSP** | NO | NO |
            | **MIUI** | NO | YES |
            | **AOSP-KSU** | YES | NO |
            | **MIUI-KSU** | YES | YES |

            *Synchronization Ratio: 400%*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
